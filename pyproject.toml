[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neptune-code"
version = "0.1.6"
description = "A model harness like claudecode or codex built in python, supports Anthropic natively and a large amount of models via OpenRouter and Ollama"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Optccopa" }]
keywords = ["llm", "cli", "agent", "harness", "anthropic", "openrouter", "ollama"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic",
    "rich",
    "httpx2[http2]",
    "python-dotenv",
    "questionary",
    "platformdirs"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pre-commit"
]

[project.scripts]
neptune = "neptune.cli:main"

[project.urls]
Homepage = "https://github.com/Optccopa/neptune"
Repository = "https://github.com/Optccopa/neptune"
Issues = "https://github.com/Optccopa/neptune/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neptune = ["SYSTEM.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src/neptune"]
check_untyped_defs = true
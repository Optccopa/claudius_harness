[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudius"
version = "0.1.0"
description = "Claudius cli assistant"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "rich",
    "httpx",
    "python-dotenv",
    "questionary",
]

[project.scripts]
claudius = "claudius.main:run"

[tool.setuptools.packages.find]
where = ["src"]

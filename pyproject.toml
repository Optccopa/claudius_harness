[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudius"
version = "0.1.0"
description = "Claudius cli assistant"
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "rich",
    "httpx",
    "python-dotenv",
    "questionary",
    "platformdirs"
]

[project.scripts]
claudius = "claudius.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
